<!DOCTYPE html>
<html>
  <head>
    <!-- Vercel may serve /monster-tamer without adding a trailing slash.
         Pin relative scripts, fonts and game assets to the game directory. -->
    <base href="/monster-tamer/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Tamer</title>
    <style>
      html,
      body,
      .container {
        margin: 0px;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: #d7d7d7;
      }

      .mobile-game-controls { display: none; }
      @media (pointer: coarse), (max-width: 900px) {
        .mobile-game-controls { position: fixed; z-index: 9999; inset: 0; display: block; pointer-events: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .mobile-dpad, .mobile-actions { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); display: grid; gap: 5px; padding: 6px; pointer-events: auto; }
        .mobile-dpad { left: max(10px, env(safe-area-inset-left)); grid-template: repeat(2, 48px) / repeat(3, 48px); }
        .mobile-dpad button:nth-child(1) { grid-column: 2; }
        .mobile-dpad button:nth-child(2) { grid-area: 2 / 1; }
        .mobile-dpad button:nth-child(3) { grid-area: 2 / 2; }
        .mobile-dpad button:nth-child(4) { grid-area: 2 / 3; }
        .mobile-actions { right: max(10px, env(safe-area-inset-right)); grid-template-columns: repeat(2, 58px); align-items: end; }
        .mobile-actions .menu { grid-column: 1 / -1; height: 28px; font-size: 9px; }
        .mobile-game-controls button { width: 48px; height: 48px; padding: 0; border: 2px solid rgba(255,255,255,.34); border-radius: 50%; color: rgba(255,255,255,.86); background: rgba(15,23,42,.22); box-shadow: 0 2px 8px rgba(0,0,0,.14); font: 900 20px system-ui; backdrop-filter: blur(1.5px); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
        .mobile-actions button { width: 58px; height: 58px; }
        .mobile-actions .primary { background: rgba(220,38,38,.25); }
        .mobile-game-controls button:active { background: rgba(255,255,255,.34); transform: scale(.94); }
      }

      @font-face {
        font-family: Kenney-Future-Narrow;
        src: url('assets/fonts/kenneys-fonts/Kenney-Future-Narrow.ttf') format('truetype');
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/webfontloader@1.6.28/webfontloader.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  </head>
  <body>
    <div class="container" id="game-container"></div>
    <script src="../shared/condaweb-bridge.js"></script>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
