<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CondaWeb Games</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071c14; color: #f8fff9; }
      main { width: min(900px, calc(100% - 32px)); padding: 48px; border: 2px solid #9eea72; border-radius: 28px; background: #102d21; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4rem); }
      p { color: #cde4d4; font-size: 1.1rem; }
      nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-top: 32px; }
      a { padding: 20px; border-radius: 16px; background: #8cf05c; color: #082314; font-weight: 800; text-decoration: none; text-align: center; }
      a:hover { background: #b5ff8e; transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <main>
      <h1>CondaWeb Games</h1>
      <p>Les jeux éducatifs sont correctement déployés. CondaWeb les ouvre automatiquement avec les fiches et les QCM de l’élève.</p>
      <nav>
        <a href="/wispguard/">Wispguard</a>
        <a href="/monster-tamer/">Monster Tamer</a>
        <a href="/simple-rpg/">Simple RPG</a>
      </nav>
    </main>
  </body>
</html>
